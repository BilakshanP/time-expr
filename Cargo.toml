[workspace]
resolver = "2"
members = ["time-expr", "time-expr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bilakshanp/time-expr"

[workspace.dependencies]
time-expr = { path = "time-expr", version = "0.1.0" }

[profile.release]
lto = "fat"
strip = true
opt-level = 3
panic = "abort"
codegen-units = 1
